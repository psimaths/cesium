<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesium 3D Map Viewer</title>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" />
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #cesiumContainer {
            width: 100%;
            height: 100%;
        }
        .info-box {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
            z-index: 1000;
            font-family: Arial, sans-serif;
            font-size: 13px;
            max-width: 240px;
            backdrop-filter: blur(5px);
        }
        .info-box strong {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }
        .info-box div {
            margin: 5px 0;
            color: #555;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div class="info-box">
        <strong>3D Navigation Controls</strong>
        <div>🖱️ Left-drag: Rotate view</div>
        <div>🖱️ Right-drag: Pan</div>
        <div>🔍 Scroll: Zoom in/out</div>
        <div>🖱️ Middle-drag: Tilt view</div>
        <div>📍 Double-click: Zoom to location</div>
    </div>
    
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
    <script>
        // No Cesium Ion token needed - we're only using custom tiles!
        
        // Load metadata.json for map bounds (with cache busting)
        fetch('metadata.json?v=' + Date.now())
            .then(response => response.json())
            .then(metadata => {
                console.log('Loaded metadata:', metadata);
                initializeViewer(metadata);
            })
            .catch(error => {
                console.warn('Could not load metadata.json:', error);
                console.log('Using fallback coordinates');
                // Fallback to default coordinates
                initializeViewer({
                    west: 0,
                    south: 0,
                    east: 1,
                    north: 1
                });
            });
        
        function initializeViewer(metadata) {
            // Use metadata directly (now has correct coordinates)
            const west = metadata.west;     // 122.01... (longitude)
            const south = metadata.south;   // 11.408... (latitude)
            const east = metadata.east;     // 122.02... (longitude)
            const north = metadata.north;   // 11.418... (latitude)
            
            console.log('Map bounds:', { west, south, east, north });
            
            // Create the Cesium viewer
            const viewer = new Cesium.Viewer('cesiumContainer', {
                // Imagery settings
                baseLayerPicker: false,  // No base layer picker (we're only using custom tiles)
                imageryProvider: false,  // We'll add our custom provider manually
                
                // Terrain settings (flat terrain for now, ready for elevation data later)
                terrainProvider: new Cesium.EllipsoidTerrainProvider(),
                
                // UI controls
                animation: false,  // No animation timeline
                timeline: false,  // No timeline
                fullscreenButton: true,
                vrButton: false,
                geocoder: false,  // No geocoder (would require Ion services)
                homeButton: true,
                infoBox: true,
                sceneModePicker: true,  // Allow 2D/3D switching
                selectionIndicator: false,
                navigationHelpButton: true,
                
                // Scene settings
                scene3DOnly: false,  // Allow 2D and 3D modes
                shadows: false,  // No shadows for better performance
                
                // Credit settings
                creditContainer: document.createElement('div'),  // Hide credits in custom div
            });
            
            // Configure scene for better visuals
            viewer.scene.globe.enableLighting = false;
            viewer.scene.fog.enabled = true;
            viewer.scene.fog.density = 0.0001;
            
            // Calculate bounds for custom tiles using corrected coordinates
            const rectangle = Cesium.Rectangle.fromDegrees(
                west,
                south,
                east,
                north
            );
            
            // Add custom imagery layer from our tiles
            // Using XYZ tile scheme (matches gdal2tiles --xyz output)
            const customImageryProvider = new Cesium.UrlTemplateImageryProvider({
                url: window.location.origin + '/{z}/{x}/{y}.png',
                tilingScheme: new Cesium.WebMercatorTilingScheme(),
                rectangle: rectangle,  // Constrain to actual map bounds
                minimumLevel: 10,
                maximumLevel: 22,
                tileWidth: 256,
                tileHeight: 256,
                hasAlphaChannel: true,
                credit: 'Custom Map Data'
            });
            
            // Add the custom imagery layer
            const customLayer = viewer.imageryLayers.addImageryProvider(customImageryProvider);
            customLayer.alpha = 1.0;  // Full opacity
            
            // No base layer needed - just showing custom tiles on blank globe
            // (Cesium's base layer would require Ion token/subscription)
            
            // Calculate center of the map bounds
            const centerLon = (west + east) / 2;  // ~122.02 degrees
            const centerLat = (south + north) / 2;  // ~11.41 degrees
            
            console.log(`Map center: Lon=${centerLon.toFixed(6)}, Lat=${centerLat.toFixed(6)}`);
            
            // Set camera height for small area (zoom in close to see tiles)
            let cameraHeight = 1500;  // 1.5km height - close view
            
            // Set camera position immediately (no fly animation) 
            viewer.camera.setView({
                destination: Cesium.Cartesian3.fromDegrees(centerLon, centerLat, cameraHeight),
                orientation: {
                    heading: Cesium.Math.toRadians(0),
                    pitch: Cesium.Math.toRadians(-90),  // Look straight down initially
                    roll: 0.0
                }
            });
            
            // Add a rectangle entity to show coverage area
            viewer.entities.add({
                name: 'Custom Map Coverage Area',
                rectangle: {
                    coordinates: rectangle,
                    material: Cesium.Color.ORANGE.withAlpha(0.0),
                    outline: true,
                    outlineColor: Cesium.Color.ORANGE,
                    outlineWidth: 2,
                    height: 0
                },
                description: `<p>Custom Map Coverage</p>
                    <p>West: ${west.toFixed(6)}°</p>
                    <p>South: ${south.toFixed(6)}°</p>
                    <p>East: ${east.toFixed(6)}°</p>
                    <p>North: ${north.toFixed(6)}°</p>`
            });
            
            // Set home view to our custom area
            viewer.homeButton.viewModel.command.beforeExecute.addEventListener(function(e) {
                e.cancel = true;
                viewer.camera.setView({
                    destination: Cesium.Cartesian3.fromDegrees(centerLon, centerLat, cameraHeight),
                    orientation: {
                        heading: Cesium.Math.toRadians(0),
                        pitch: Cesium.Math.toRadians(-90),
                        roll: 0.0
                    }
                });
            });
            
            console.log('Cesium viewer initialized successfully!');
            console.log(`Map bounds: [${west.toFixed(6)}, ${south.toFixed(6)}] to [${east.toFixed(6)}, ${north.toFixed(6)}]`);
            console.log(`Camera position: Lon=${centerLon.toFixed(6)}, Lat=${centerLat.toFixed(6)}, Height=${cameraHeight}m`);
        }
    </script>
</body>
</html>
