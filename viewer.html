<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .info-box {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
            font-family: Arial, sans-serif;
            font-size: 13px;
            max-width: 200px;
        }
        .info-box strong {
            display: block;
            margin-bottom: 8px;
            color: #333;
        }
        .info-box div {
            margin: 4px 0;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-box">
        <strong>Map Controls</strong>
        <div>🖱️ Drag to pan</div>
        <div>🔍 Scroll to zoom</div>
        <div>📍 Double-click to zoom in</div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Check if tilemapresource.xml exists (generated by gdal2tiles)
        fetch('tilemapresource.xml')
            .then(response => response.text())
            .then(xml => {
                // Parse the XML to get bounds
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xml, "text/xml");
                const boundingBox = xmlDoc.getElementsByTagName('BoundingBox')[0];
                
                let minLat, minLon, maxLat, maxLon;
                
                if (boundingBox) {
                    minLon = parseFloat(boundingBox.getAttribute('minx'));
                    minLat = parseFloat(boundingBox.getAttribute('miny'));
                    maxLon = parseFloat(boundingBox.getAttribute('maxx'));
                    maxLat = parseFloat(boundingBox.getAttribute('maxy'));
                    console.log('Bounds from XML:', { minLat, minLon, maxLat, maxLon });
                }
                
                // Initialize the map
                const centerLat = (maxLat + minLat) / 2;
                const centerLon = (maxLon + minLon) / 2;
                
                const map = L.map('map', {
                    center: [centerLat, centerLon],
                    zoom: 13
                });
                
                // Add OpenStreetMap as base layer
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    opacity: 0.3
                }).addTo(map);
                
                // Add custom tile layer (TMS format - gdal2tiles default)
                const customTiles = L.tileLayer(window.location.origin + '/{z}/{x}/{y}.png', {
                    tms: true,  // TMS format (inverted Y axis) - REQUIRED for gdal2tiles
                    opacity: 1.0,
                    attribution: 'Custom Map',
                    maxNativeZoom: 22,  // Tiles exist up to zoom 22
                    maxZoom: 25  // But allow zooming further (will scale tiles)
                }).addTo(map);
                
                // Add tile load error handler for debugging
                let errorCount = 0;
                customTiles.on('tileerror', function(error) {
                    errorCount++;
                    if (errorCount <= 3) {
                        console.log('Tile load error:', error.coords, error.tile.src);
                    }
                });
                
                // Fit map to bounds
                if (boundingBox) {
                    const bounds = L.latLngBounds(
                        L.latLng(minLat, minLon),
                        L.latLng(maxLat, maxLon)
                    );
                    map.fitBounds(bounds);
                    
                    // Add rectangle to show coverage area
                    L.rectangle(bounds, {
                        color: "#ff7800",
                        weight: 2,
                        fillOpacity: 0,
                        dashArray: '5, 10'
                    }).addTo(map).bindPopup('Custom Map Coverage Area');
                }
                
                console.log('Map initialized successfully!');
            })
            .catch(error => {
                console.warn('Could not load tilemapresource.xml, using fallback:', error);
                
                // Fallback: Initialize map with default view
                const map = L.map('map', {
                    center: [0, 0],
                    zoom: 2
                });
                
                // Add OpenStreetMap
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    opacity: 0.3
                }).addTo(map);
                
                // Add custom tiles (TMS format - REQUIRED for gdal2tiles)
                L.tileLayer(window.location.origin + '/{z}/{x}/{y}.png', {
                    tms: true,  // TMS format (inverted Y axis)
                    opacity: 1.0,
                    attribution: 'Custom Map',
                    maxNativeZoom: 22,
                    maxZoom: 25
                }).addTo(map);
                
                console.log('Map initialized with fallback settings');
            });
    </script>
</body>
</html>
