<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesium 3D Map Viewer</title>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" />
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #cesiumContainer {
            width: 100%;
            height: 100%;
        }
        .info-box {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
            z-index: 1000;
            font-family: Arial, sans-serif;
            font-size: 13px;
            max-width: 240px;
            backdrop-filter: blur(5px);
        }
        .info-box strong {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }
        .info-box div {
            margin: 5px 0;
            color: #555;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div class="info-box">
        <strong>3D Navigation Controls</strong>
        <div>🖱️ Left Drag: Pan/move map</div>
        <div>⇧ Shift+Drag: Rotate view</div>
        <div>🖱️ Right/Ctrl+Drag: Tilt view</div>
        <div>🔍 Scroll: Zoom in/out</div>
        <div>⌨️ Space: Reset to home view</div>
    </div>
    
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
    <script src="script.js"></script>
</body>
</html>
