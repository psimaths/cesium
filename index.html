<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesium 3D Map Viewer</title>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" />
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #cesiumContainer {
            width: 100%;
            height: 100%;
        }
        .info-box {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
            z-index: 1000;
            font-family: Arial, sans-serif;
            font-size: 13px;
            max-width: 240px;
            backdrop-filter: blur(5px);
        }
        .info-box strong {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }
        .info-box div {
            margin: 5px 0;
            color: #555;
            line-height: 1.4;
        }
        .controls-box {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
            z-index: 1000;
            font-family: Arial, sans-serif;
            font-size: 13px;
            min-width: 200px;
            backdrop-filter: blur(5px);
        }
        .controls-box strong {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }
        .control-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .control-item label {
            color: #555;
            cursor: pointer;
            user-select: none;
        }
        .control-item input[type="checkbox"] {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div class="controls-box">
        <strong>Map Controls</strong>
        <div class="control-item">
            <label for="contourToggle">Contour Lines</label>
            <input type="checkbox" id="contourToggle" checked>
        </div>
    </div>
    <div class="info-box">
        <strong>3D Navigation Controls</strong>
        <div>🖱️ Left Drag: Pan/move map</div>
        <div>⇧ Shift+Drag: Rotate view</div>
        <div>🖱️ Right/Ctrl+Drag: Tilt view</div>
        <div>🔍 Scroll: Zoom in/out</div>
        <div>⌨️ Space: Reset to home view</div>
    </div>
    
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
    <script>
        // No Cesium Ion token needed - we're only using custom tiles!
        
        // Load metadata.json for map bounds (with cache busting)
        fetch('tiles/metadata.json?v=' + Date.now())
            .then(response => response.json())
            .then(metadata => {
                console.log('Loaded metadata:', metadata);
                initializeViewer(metadata);
            })
            .catch(error => {
                console.warn('Could not load metadata.json:', error);
                console.log('Using fallback coordinates');
                // Fallback to default coordinates
                initializeViewer({
                    west: 0,
                    south: 0,
                    east: 1,
                    north: 1
                });
            });
        
        async function initializeViewer(metadata) {
            // Use metadata directly (now has correct coordinates)
            const west = metadata.west;     // 122.01... (longitude)
            const south = metadata.south;   // 11.408... (latitude)
            const east = metadata.east;     // 122.02... (longitude)
            const north = metadata.north;   // 11.418... (latitude)
            
            console.log('Map bounds:', { west, south, east, north });
            
            // Create the Cesium viewer
            const viewer = new Cesium.Viewer('cesiumContainer', {
                // Imagery settings
                baseLayerPicker: false,  // No base layer picker (we're only using custom tiles)
                imageryProvider: false,  // We'll add our custom provider manually
                
                // Terrain settings - using ArcGIS World Elevation (free, no token required)
                terrainProvider: await Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(
                    'https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer'
                ),
                
                // UI controls
                animation: false,  // No animation timeline
                timeline: false,  // No timeline
                fullscreenButton: true,
                vrButton: false,
                geocoder: false,  // No geocoder (would require Ion services)
                homeButton: true,
                infoBox: true,
                sceneModePicker: true,  // Allow 2D/3D switching
                selectionIndicator: false,
                navigationHelpButton: true,
                
                // Scene settings
                scene3DOnly: false,  // Allow 2D and 3D modes
                shadows: false,  // No shadows for better performance
                
                // Credit settings
                creditContainer: document.createElement('div'),  // Hide credits in custom div
            });
            
            // Configure scene for better visuals with terrain
            viewer.scene.globe.enableLighting = true;  // Enable lighting to see terrain relief
            viewer.scene.globe.depthTestAgainstTerrain = true;  // Proper depth testing with terrain
            viewer.scene.fog.enabled = true;
            viewer.scene.fog.density = 0.0001;
            
            // Optional: Add vertical exaggeration to make terrain more visible
            // Adjust this value (1.0 = no exaggeration, 2.0 = 2x height, etc.)
            viewer.scene.verticalExaggeration = 2.0;

            // Customize camera controls for intuitive navigation
            const scene = viewer.scene;
            const camera = viewer.camera;
            const controller = scene.screenSpaceCameraController;
            
            // Configure custom mouse controls:
            // - Left drag (no modifier) = Pan/translate
            // - Shift + left drag = Rotate/look around
            // - Right drag or Ctrl + left drag = Tilt
            // - Scroll = Zoom
            
            // Keep zoom and translation enabled
            controller.enableZoom = true;
            controller.enableTranslate = true;
            controller.enableLook = true;
            controller.enableTilt = true;
            controller.enableRotate = true;
            
            // Set up the event mappings - must use correct object syntax for modifiers
            controller.translateEventTypes = Cesium.CameraEventType.LEFT_DRAG;
            
            controller.lookEventTypes = {
                eventType: Cesium.CameraEventType.LEFT_DRAG,
                modifier: Cesium.KeyboardEventModifier.SHIFT
            };
            
            controller.tiltEventTypes = [
                Cesium.CameraEventType.RIGHT_DRAG,
                Cesium.CameraEventType.MIDDLE_DRAG,
                {
                    eventType: Cesium.CameraEventType.LEFT_DRAG,
                    modifier: Cesium.KeyboardEventModifier.CTRL
                }
            ];
            
            controller.zoomEventTypes = [
                Cesium.CameraEventType.WHEEL,
                Cesium.CameraEventType.PINCH
            ];
            
            // Enable keyboard controls (arrow keys, +/-, spacebar for stopping inertia)
            controller.enableInputs = true;
            
            console.log('Custom camera controls enabled: Drag=Pan, Shift+Drag=Look, Right/Ctrl+Drag=Tilt');
            
            // Calculate bounds for custom tiles using corrected coordinates
            const rectangle = Cesium.Rectangle.fromDegrees(
                west,
                south,
                east,
                north
            );
            
            // Add custom imagery layer from our tiles
            // Using XYZ tile scheme (matches gdal2tiles --xyz output)
            const customImageryProvider = new Cesium.UrlTemplateImageryProvider({
                url: window.location.origin + '/tiles/{z}/{x}/{y}.png',
                tilingScheme: new Cesium.WebMercatorTilingScheme(),
                rectangle: rectangle,  // Constrain to actual map bounds
                minimumLevel: 10,
                maximumLevel: 22,
                tileWidth: 256,
                tileHeight: 256,
                hasAlphaChannel: true,
                credit: 'Custom Map Data'
            });
            
            // Add the custom imagery layer
            const customLayer = viewer.imageryLayers.addImageryProvider(customImageryProvider);
            customLayer.alpha = 1.0;  // Full opacity
            
            // No base layer needed - just showing custom tiles on blank globe
            // (Cesium's base layer would require Ion token/subscription)
            
            // Calculate center of the map bounds
            const centerLon = (west + east) / 2;  // ~122.02 degrees
            const centerLat = (south + north) / 2;  // ~11.41 degrees
            
            console.log(`Map center: Lon=${centerLon.toFixed(6)}, Lat=${centerLat.toFixed(6)}`);
            
            // Set camera height for small area (zoom in close to see tiles)
            let cameraHeight = 1500;  // 1.5km height - close view
            
            // Set camera position immediately (no fly animation) 
            viewer.camera.setView({
                destination: Cesium.Cartesian3.fromDegrees(centerLon, centerLat, cameraHeight),
                orientation: {
                    heading: Cesium.Math.toRadians(0),
                    pitch: Cesium.Math.toRadians(-90),  // Look straight down initially
                    roll: 0.0
                }
            });
            
           
            
            // Set home view to our custom area
            viewer.homeButton.viewModel.command.beforeExecute.addEventListener(function(e) {
                e.cancel = true;
                viewer.camera.setView({
                    destination: Cesium.Cartesian3.fromDegrees(centerLon, centerLat, cameraHeight),
                    orientation: {
                        heading: Cesium.Math.toRadians(0),
                        pitch: Cesium.Math.toRadians(-90),
                        roll: 0.0
                    }
                });
            });
            
            // Add keyboard controls - Space to reset view
            document.addEventListener('keydown', function(e) {
                if (e.code === 'Space' && !e.repeat) {
                    e.preventDefault();
                    // Reset to home view
                    viewer.camera.flyTo({
                        destination: Cesium.Cartesian3.fromDegrees(centerLon, centerLat, cameraHeight),
                        orientation: {
                            heading: Cesium.Math.toRadians(0),
                            pitch: Cesium.Math.toRadians(-90),
                            roll: 0.0
                        },
                        duration: 1.0  // 1 second animation
                    });
                }
            });
            
            console.log('Cesium viewer initialized successfully!');
            console.log(`Map bounds: [${west.toFixed(6)}, ${south.toFixed(6)}] to [${east.toFixed(6)}, ${north.toFixed(6)}]`);
            console.log(`Camera position: Lon=${centerLon.toFixed(6)}, Lat=${centerLat.toFixed(6)}, Height=${cameraHeight}m`);
            
            // Load and display contour lines
            loadContours(viewer);
        }
        
        // Global variable to store contour data source
        let contourDataSource = null;
        
        function loadContours(viewer) {
            // Try to load contours.json
            fetch('tiles/contours.json?v=' + Date.now())
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Contours file not found');
                    }
                    return response.json();
                })
                .then(geojson => {
                    console.log('Loaded contour data:', geojson.features.length, 'contour lines');
                    
                    // Create a custom GeoJSON data source for better control
                    const contourPromise = Cesium.GeoJsonDataSource.load(geojson, {
                        stroke: Cesium.Color.BROWN.withAlpha(0.8),
                        strokeWidth: 2,
                        clampToGround: true
                    });
                    
                    contourPromise.then(dataSource => {
                        contourDataSource = dataSource;
                        viewer.dataSources.add(dataSource);
                        
                        // Style the contour lines based on elevation
                        const entities = dataSource.entities.values;
                        let minElevation = Infinity;
                        let maxElevation = -Infinity;
                        
                        // Find elevation range
                        entities.forEach(entity => {
                            if (entity.properties && entity.properties.elevation) {
                                const elev = entity.properties.elevation.getValue();
                                minElevation = Math.min(minElevation, elev);
                                maxElevation = Math.max(maxElevation, elev);
                            }
                        });
                        
                        console.log(`Contour elevation range: ${minElevation}m to ${maxElevation}m`);
                        
                        // Style contours based on elevation
                        entities.forEach(entity => {
                            if (entity.properties && entity.properties.elevation) {
                                const elevation = entity.properties.elevation.getValue();
                                
                                // Major contours every 50m - thicker and darker
                                const isMajor = elevation % 50 === 0;
                                
                                // Color gradient from brown (low) to dark brown (high)
                                const t = (elevation - minElevation) / (maxElevation - minElevation);
                                const color = Cesium.Color.fromCssColorString(
                                    isMajor ? '#5c3317' : '#8B4513'
                                ).withAlpha(isMajor ? 0.9 : 0.6);
                                
                                entity.polyline = {
                                    positions: entity.polyline.positions,
                                    width: isMajor ? 2.5 : 1.5,
                                    material: color,
                                    clampToGround: true
                                };
                                
                                // Add label for major contours
                                if (isMajor && entity.polyline.positions) {
                                    const positions = entity.polyline.positions.getValue(Cesium.JulianDate.now());
                                    if (positions && positions.length > 0) {
                                        // Place label at midpoint of line
                                        const midIndex = Math.floor(positions.length / 2);
                                        const midPosition = positions[midIndex];
                                        
                                        // Add elevation label
                                        viewer.entities.add({
                                            position: midPosition,
                                            label: {
                                                text: `${elevation}m`,
                                                font: '12px sans-serif',
                                                fillColor: Cesium.Color.fromCssColorString('#5c3317'),
                                                outlineColor: Cesium.Color.WHITE,
                                                outlineWidth: 2,
                                                style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                                                pixelOffset: new Cesium.Cartesian2(0, -10),
                                                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                                                scaleByDistance: new Cesium.NearFarScalar(500, 1.0, 5000, 0.3)
                                            }
                                        });
                                    }
                                }
                                
                                // Set description for popup
                                entity.description = `<p><strong>Elevation:</strong> ${elevation} meters</p>`;
                            }
                        });
                        
                        console.log('Contour lines styled and added to map');
                    }).catch(error => {
                        console.error('Error loading contour GeoJSON:', error);
                    });
                })
                .catch(error => {
                    console.warn('Contours not available:', error.message);
                    console.log('Run "python generate_contours.py topo.tif" to generate contour lines');
                });
        }
        
        // Toggle contour visibility
        document.getElementById('contourToggle').addEventListener('change', function(e) {
            if (contourDataSource) {
                contourDataSource.show = e.target.checked;
                console.log('Contours', e.target.checked ? 'shown' : 'hidden');
            }
        });
    </script>
</body>
</html>
